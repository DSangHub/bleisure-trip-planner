<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f1419">
  <title>Offline | Bleisure Trip Planner</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #0f1419;
      color: #e8edf5;
      padding: 1.5rem;
    }
    .card {
      max-width: 28rem;
      border: 1px solid #2f3f57;
      border-radius: 1rem;
      background: #1a2332;
      padding: 1.5rem;
      text-align: center;
    }
    h1 { margin: 0 0 0.5rem; font-size: 1.5rem; }
    p { color: #94a3b8; line-height: 1.5; }
    a {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      color: #081018;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You are offline</h1>
    <p>
      Cached itineraries and saved trips are still available in the app.
      Reconnect to refresh maps, hotels, and geocoding.
    </p>
    <a href="/planner/">Open planner</a>
  </div>
</body>
</html>
